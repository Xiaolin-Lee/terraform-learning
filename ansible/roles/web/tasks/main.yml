---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install Docker
  ansible.builtin.apt:
    name: docker.io
    state: present

- name: Ensure Docker is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add azureuser to docker group
  ansible.builtin.user:
    name: azureuser
    groups: docker
    append: true

- name: Install Azure CLI
  ansible.builtin.shell:
    cmd: curl -sL https://aka.ms/InstallAzureCLIDeb | bash
    creates: /usr/bin/az

- name: Login to Azure using Managed Identity
  ansible.builtin.command:
    cmd: az login --identity
  changed_when: false

- name: Login to Azure Container Registry
  ansible.builtin.command:
    cmd: az acr login --name {{ acr_name }}
  changed_when: false

- name: Pull application image
  ansible.builtin.command:
    cmd: docker pull {{ acr_login_server }}/myapp:{{ image_tag }}

- name: Get database password from Key Vault
  ansible.builtin.command:
    cmd: >
      az keyvault secret show
      --vault-name {{ key_vault_name }}
      --name {{ key_vault_secret_name }}
      --query value
      --output tsv
  register: db_password
  changed_when: false
  no_log: true

- name: Run application container
  community.docker.docker_container:
    name: "{{ container_name }}"
    image: "{{ acr_login_server }}/myapp:{{ image_tag }}"
    state: started
    restart_policy: always
    ports:
      - "{{ host_port }}:{{ container_port }}"
    env:
      SPRING_DATASOURCE_USERNAME: "{{ db_username }}"
      SPRING_DATASOURCE_PASSWORD: "{{ db_password.stdout }}"
      DB_HOST: "{{ db_host }}"
      DB_PORT: "{{ db_port }}"
      DB_NAME: "{{ db_name }}"
  no_log: true