services:
  db:
    container_name: base-postgres
    image: 'postgres:18'
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: echo "*:*:*:*:$$POSTGRES_PASSWORD" > ~/.pgpass; psql --host=127.0.0.1 --port=5432 --command="SELECT 1" "$$POSTGRES_DB" "$$POSTGRES_USER"
      timeout: 10s
      retries: 5
      interval: 5s
      start_period: 30s
    volumes:
      - './db_init.sh:/docker-entrypoint-initdb.d/db_init.sh:ro'
