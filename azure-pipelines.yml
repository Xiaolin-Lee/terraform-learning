# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- checkout: self

- task: JavaToolInstaller@1
  inputs:
    versionSpec: '17'
    jdkArchitectureOption: x64
    jdkSourceOption: PreInstalled

- script: |
    cd webApplication
    chmod +x gradlew
    ./gradlew clean test bootJar
  displayName: "Build Spring Boot"

- task: Docker@2
  displayName: "Build and Push Docker Image"
  inputs:
    command: buildAndPush
    containerRegistry: "docker-terraform-learning-sc"
    repository: myapp
    Dockerfile: webApplication/Dockerfile
    buildContext: webApplication
    tags: |
      latest
      $(Build.BuildId)

- task: SSH@0
  inputs:
    sshEndpoint: vm-ssh
    displayName: "Deploy Docker Image"
    runOptions: inline
    inline: |
      docker pull xiaolinterraformacr01.azurecr.io/myapp:latest
      docker stop myapp || true
      docker rm myapp || true
      docker run -d --restart always --name myapp -p 8080:8080 \
        xiaolinterraformacr01.azurecr.io/myapp:$(Build.BuildId)