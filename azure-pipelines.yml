# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- checkout: self

- task: JavaToolInstaller@1
  inputs:
    versionSpec: '17'
    jdkArchitectureOption: x64
    jdkSourceOption: PreInstalled

- script: |
    cd webApplication
    chmod +x gradlew
    ./gradlew clean test bootJar
  displayName: "Build Spring Boot"

- task: Docker@2
  displayName: "Build and Push Docker Image"
  inputs:
    command: buildAndPush
    containerRegistry: "docker-terraform-learning-sc"
    repository: myapp
    Dockerfile: webApplication/Dockerfile
    buildContext: webApplication
    tags: |
      latest
      $(Build.BuildId)

- task: SSH@0
  inputs:
    sshEndpoint: vm-ssh
    displayName: "Deploy Docker Image"
    runOptions: inline
    inline: |
      az login --identity
      az acr login --name xiaolinterraformacr01
      docker pull xiaolinterraformacr01.azurecr.io/myapp:$(Build.BuildId)
      
      DB_PASSWORD=$(az keyvault secret show \
      --vault-name xlli-learning-kv \
      --name db-password \
      --query value -o tsv)
      
      if docker ps -a --format '{{.Names}}' | grep -qx "myapp"; then
        docker stop myapp
        docker rm myapp
      fi
      docker run -d \
      --restart always \
      --name myapp \
      -p 8080:8080 \
      -e SPRING_DATASOURCE_USERNAME="postgresadmin" \
      -e SPRING_DATASOURCE_PASSWORD="$DB_PASSWORD" \
      -e DB_HOST="xlli-learning-postgres.postgres.database.azure.com" \
      -e DB_PORT="5432" \
      -e DB_NAME="myapp" \
      xiaolinterraformacr01.azurecr.io/myapp:latest